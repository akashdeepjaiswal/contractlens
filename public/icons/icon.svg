<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#4f46e5" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#brandGradient)" filter="url(#glow)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="4"/>
  
  <!-- Lens circle -->
  <circle cx="236" cy="226" r="120" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round"/>
  <!-- Lens handle -->
  <line x1="322" y1="312" x2="410" y2="400" stroke="#ffffff" stroke-width="26" stroke-linecap="round"/>
  
  <!-- Contract sheet lines inside lens -->
  <line x1="176" y1="190" x2="296" y2="190" stroke="rgba(255,255,255,0.85)" stroke-width="12" stroke-linecap="round"/>
  <line x1="176" y1="226" x2="296" y2="226" stroke="rgba(255,255,255,0.85)" stroke-width="12" stroke-linecap="round"/>
  <line x1="176" y1="262" x2="256" y2="262" stroke="rgba(255,255,255,0.85)" stroke-width="12" stroke-linecap="round"/>
</svg>
